name: Web uygulamasını GitHub Pages'e yayınla

on:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload web folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      # GitHub bazen az önce yüklenen dosyayı ilk aramada bulamıyor ("No artifacts named github-pages"):
      # ilk deneme düşerse bekleyip yeniden denenir.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Bekle (ilk deneme düştüyse)
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Deploy (ikinci deneme)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
