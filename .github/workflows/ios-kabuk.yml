name: App Store kabuğu (Capacitor iOS)

# web/ klasörünü uygulamanın İÇİNE paketleyen Capacitor kabuğu.
# 1) derle: her zaman imzasız iPad simülatörü derlemesi (derlendiğini kanıtlar).
# 2) testflight: yalnız elle başlatılınca VE dört secret tanımlıysa imzalayıp TestFlight'a yükler.
# Eski SwiftUI projesi (build.yml) bundan bağımsızdır.

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Secret'lar tanımlıysa TestFlight'a yükle"
        type: boolean
        default: true
  push:
    branches: [master]
    paths:
      - "ios/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "scripts/kimlik-esitle.mjs"
      - ".github/workflows/ios-kabuk.yml"

permissions:
  contents: read

concurrency:
  group: ios-kabuk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  derle:
    runs-on: macos-26
    outputs:
      imza_hazir: ${{ steps.secretler.outputs.hazir }}
    steps:
      - name: Kaynağı al
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Araç sürümleri
        run: |
          xcodebuild -version
          node --version
          npm --version

      - name: Bağımlılıklar
        run: npm ci

      - name: Web dosyalarını kabuğa kopyala (cap sync)
        run: npm run cap:sync

      - name: Paketlenen web dosyalarını denetle
        run: |
          test -f ios/App/App/public/index.html
          test -f ios/App/App/public/js/app.js
          test -f ios/App/App/public/vendor/pdf.min.mjs
          grep -o 'notdefteri-v[0-9]*' ios/App/App/public/sw.js

      - name: .mjs MIME türü (bilgi amaçlı; PDF.js modülü bunu ister)
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/mime.swift" <<'SWIFT'
          import UniformTypeIdentifiers
          for e in ["mjs", "js", "woff2", "webmanifest", "mp3"] {
              print(e, UTType(filenameExtension: e)?.preferredMIMEType ?? "YOK")
          }
          SWIFT
          OUT="$(swift "$RUNNER_TEMP/mime.swift")"
          echo "$OUT"
          echo "$OUT" | grep -q '^mjs .*javascript' || echo "::warning::.mjs için JavaScript MIME türü bulunamadı; PDF şablonlarını cihazda dene."

      - name: Swift paketlerini çöz
        run: >-
          xcodebuild -resolvePackageDependencies
          -project ios/App/App.xcodeproj
          -scheme App

      - name: iPad simülatörü için imzasız derle
        shell: bash
        run: |
          SIM_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for g in d["devices"].values() for x in g if x["isAvailable"] and x["name"].startswith("iPad")), ""))')"
          if [[ -n "$SIM_ID" ]]; then DEST="platform=iOS Simulator,id=$SIM_ID"; else DEST="generic/platform=iOS Simulator"; fi
          echo "Hedef: $DEST"
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination "$DEST" \
            -derivedDataPath ios/App/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Derlenen uygulamayı denetle
        run: |
          APP="$(find ios/App/build/DerivedData/Build/Products -maxdepth 2 -name 'App.app' -type d | head -1)"
          test -n "$APP"
          test -f "$APP/public/index.html"
          BEKLENEN="$(node -p "require('./capacitor.config.json').appId")"
          GERCEK="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")"
          echo "Paket kimliği: $GERCEK"
          test "$BEKLENEN" = "$GERCEK"
          /usr/libexec/PlistBuddy -c 'Print UIDeviceFamily' "$APP/Info.plist"

      - name: TestFlight secret'ları tanımlı mı?
        id: secretler
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$ASC_KEY_ID" && -n "$ASC_ISSUER_ID" && -n "$ASC_KEY_P8" && -n "$APPLE_TEAM_ID" ]]; then
            echo "hazir=true" >> "$GITHUB_OUTPUT"
          else
            echo "hazir=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TestFlight adımı atlanacak: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID secret'larından en az biri yok."
          fi

  testflight:
    needs: derle
    if: needs.derle.outputs.imza_hazir == 'true' && github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Kaynağı al
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Bağımlılıklar ve cap sync
        run: |
          npm ci
          npm run cap:sync

      - name: App Store Connect API anahtarını geçici dosyaya yaz
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Arşivle (otomatik imzalama)
        run: |
          SURUM="$(node -p "require('./package.json').version")"
          DERLEME="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "Sürüm $SURUM, derleme $DERLEME"
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/NotDefteri.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$SURUM" \
            CURRENT_PROJECT_VERSION="$DERLEME"

      - name: Dışa aktar ve TestFlight'a yükle
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NotDefteri.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Anahtar dosyasını sil
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
