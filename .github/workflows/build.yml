name: Not Defteri iPad derlemesi

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Report toolchain versions
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test on an available iPad simulator
        shell: bash
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for group in d["devices"].values() for x in group if x["isAvailable"] and x["name"].startswith("iPad")), ""))')"
          if [[ -z "$SIMULATOR_ID" ]]; then
            echo "No available iPad simulator was found on this runner." >&2
            xcrun simctl list devices available
            exit 1
          fi
          xcodebuild test \
            -project PencilPages.xcodeproj \
            -scheme PencilPages \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned iPad app
        run: >-
          xcodebuild build
          -project PencilPages.xcodeproj
          -scheme PencilPages
          -sdk iphoneos
          -configuration Release
          -derivedDataPath build/DerivedData
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/PencilPages.app build/Payload/
          APP_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' build/Payload/PencilPages.app/Info.plist)"
          if [[ "$APP_BUNDLE_ID" != "com.notdefteri.app" ]]; then
            echo "Unexpected app bundle identifier: $APP_BUNDLE_ID" >&2
            exit 1
          fi
          cd build
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload PencilPages-unsigned.ipa
          unzip -t PencilPages-unsigned.ipa
          shasum -a 256 PencilPages-unsigned.ipa > PencilPages-unsigned.ipa.sha256

      - name: Upload unsigned IPA
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NotDefteri-unsigned-ipa
          path: |
            build/PencilPages-unsigned.ipa
            build/PencilPages-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 90
