  <!-- Açılışta beyaz ekran olmasın: masa rengi, son seçilen masa ve logo, kod yüklenmeden görünüyor. -->
  <style>
    html, body { background: #ece6e3; margin: 0; }
    html[data-masa="lacivert"] body, html[data-masa="gece"] body { background: #1f2a4c; }
    html[data-masa="krem"] body { background: #e9dfcc; }
    html[data-masa="pembe"] body { background: #efc7d3; }
    html[data-masa="ceviz"] body { background: #4a3022; }
    html[data-gul] body { background: #e8c6ce; }
    .acilis { position: fixed; inset: 0; display: grid; place-items: center; }
    .acilis img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 12px 28px rgba(23, 42, 69, 0.18); }
  </style>
  <script>
    try {
      var m = localStorage.getItem("notdefteri.masa") || "marka", k = document.documentElement;
      var lc = m === "marka" || m === "gul" || m === "logo";
      k.dataset.masa = lc ? "pudra" : m;
      if (lc) k.dataset.logo = "";
      if (m === "gul" || m === "logo") k.dataset.gul = "";
    } catch (e) {}
  </script>
